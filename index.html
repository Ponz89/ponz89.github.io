/* ---------- forme (unità: teschio alto ~1, origine al centro degli occhi) ---------- */
function cranium(sc = 1) {
  const q = new Path2D();
  q.moveTo(0, -0.56);
  q.bezierCurveTo(0.27, -0.56, 0.42, -0.40, 0.42, -0.17);
  q.bezierCurveTo(0.42, -0.04, 0.40, 0.04, 0.36, 0.11);
  q.bezierCurveTo(0.33, 0.17, 0.28, 0.19, 0.26, 0.24);
  q.bezierCurveTo(0.25, 0.32, 0.26, 0.40, 0.23, 0.46);
  q.bezierCurveTo(0.19, 0.53, 0.10, 0.55, 0, 0.55);
  q.bezierCurveTo(-0.10, 0.55, -0.19, 0.53, -0.23, 0.46);
  q.bezierCurveTo(-0.26, 0.40, -0.25, 0.32, -0.26, 0.24);
  q.bezierCurveTo(-0.28, 0.19, -0.33, 0.17, -0.36, 0.11);
  q.bezierCurveTo(-0.40, 0.04, -0.42, -0.04, -0.42, -0.17);
  q.bezierCurveTo(-0.42, -0.40, -0.27, -0.56, 0, -0.56);
  q.closePath();
  if (sc === 1) return q;
  const p = new Path2D(); p.addPath(q, new DOMMatrix().scale(sc)); return p;
}
function bone(x1, y1, x2, y2, w) {
  const p = new Path2D();
  const a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
  const q = new Path2D();
  q.roundRect(0, -w / 2, len, w, w / 2);
  const k = w * 0.78;
  for (const ex of [-k * 0.35, len + k * 0.35]) for (const ey of [-w * 0.62, w * 0.62]) {
    q.moveTo(ex + k, ey); q.arc(ex, ey, k, 0, Math.PI * 2);
  }
  p.addPath(q, new DOMMatrix().translate(x1, y1).rotate(a * 180 / Math.PI));
  return p;
}
function socket(s) {
  const p = new Path2D();
  p.moveTo(s * 0.035, 0.0);
  p.bezierCurveTo(s * 0.04, -0.11, s * 0.26, -0.14, s * 0.30, -0.04);
  p.bezierCurveTo(s * 0.33, 0.05, s * 0.27, 0.13, s * 0.17, 0.13);
  p.bezierCurveTo(s * 0.08, 0.13, s * 0.03, 0.08, s * 0.035, 0.0);
  p.closePath();
  return p;
}
function nose() {
  const p = new Path2D();
  p.moveTo(0, 0.14);
  p.bezierCurveTo(-0.03, 0.18, -0.075, 0.24, -0.05, 0.28);
  p.quadraticCurveTo(0, 0.255, 0.05, 0.28);
  p.bezierCurveTo(0.075, 0.24, 0.03, 0.18, 0, 0.14);
  p.closePath();
  return p;
}

/* ---------- mappa di luminosità del teschio (dà il volume) ---------- */
function buildLum() {
  const oc = document.createElement("canvas");
  oc.width = cols; oc.height = rows;
  const o = oc.getContext("2d");
  o.fillStyle = "#000"; o.fillRect(0, 0, cols, rows);
  o.setTransform(S / fs, 0, 0, S / fs, cx / fs, cy / fs);

  const g = (x0, y0, r0, x1, y1, r1, stops) => {
    const gr = o.createRadialGradient(x0, y0, r0, x1, y1, r1);
    stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;

  // ossa dietro
  const b1 = bone(-0.62, -0.13, 0.62, 0.78, 0.115), b2 = bone(0.62, -0.13, -0.62, 0.78, 0.115);
  o.fillStyle = "rgb(150,150,150)"; o.fill(b1); o.fill(b2);
  // stacco scuro fra cranio e ossa
  o.fillStyle = "#000"; o.fill(cranium(1.06));

  // cranio con luce dall'alto
  o.fillStyle = g(-0.02, -0.33, 0.02, 0, -0.05, 0.62,
    [[0, "rgb(255,255,255)"], [0.55, "rgb(215,215,215)"], [1, "rgb(120,120,120)"]]);
  o.fill(cranium());

  o.save(); o.clip(cranium());
  // tempie in ombra
  o.globalCompositeOperation = "multiply";
  for (const s of [-1, 1]) {
    o.fillStyle = g(s * 0.42, 0.02, 0, s * 0.42, 0.02, 0.16, [[0, "rgb(90,90,90)"], [1, "rgb(255,255,255)"]]);
    o.fillRect(-1, -1, 2, 2);

    o.fillRect(-1, -1, 2, 2);
  }
  // orbite: alone scuro + buco nero
  for (const s of [-1, 1]) {
    o.fillStyle = g(s * 0.17, 0.0, 0.06, s * 0.17, 0.0, 0.22, [[0, "rgba(0,0,0,0.7)"], [1, "rgba(0,0,0,0)"]]);
    o.fillRect(-1, -1, 2, 2);

  // denti: fila superiore e inferiore separate, fessure fra i denti
  o.fillStyle = g(0, 0.39, 0.02, 0, 0.39, 0.24, [[0, "rgba(255,255,255,0.9)"], [1, "rgba(255,255,255,0.15)"]]);
  o.beginPath(); o.roundRect(-0.2, 0.30, 0.40, 0.17, 0.04); o.fill();
  o.fillStyle = "rgba(0,0,0,0.9)";
  o.fillRect(-0.21, 0.38, 0.42, 0.03);
  for (let i = -3; i <= 3; i++) {
    const x = i * 0.058, h = 0.11 - Math.abs(i) * 0.008;
    o.fillRect(x - 0.012, 0.385 - h * 0.8, 0.024, h * 1.6 + 0.03);
  }
  o.restore();

  // lettura + sfocatura leggera (bordi morbidi come nel video)
  const d = o.getImageData(0, 0, cols, rows).data;
  let a = new Float32Array(cols * rows);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4] / 255;
  const r = 1;
  const blur = (src, horiz) => {
    const out = new Float32Array(src.length);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      let s = 0, n = 0;
      for (let k = -r; k <= r; k++) {
        const xx = horiz ? x + k : x, yy = horiz ? y : y + k;
        if (xx < 0 || yy < 0 || xx >= cols || yy >= rows) continue;
        s += src[yy * cols + xx] * (k === 0 ? 2 : 1); n += k === 0 ? 2 : 1;
      }
      out[y * cols + x] = s / n;
    }
    return out;
  };
  a = blur(blur(a, true), false);
  lum = a;

  // bagliore di fondo verde (riempie il volume tra un carattere e l'altro)
  glowCanvas = document.createElement("canvas");
  glowCanvas.width = cols; glowCanvas.height = rows;
  const gc = glowCanvas.getContext("2d"), id = gc.createImageData(cols, rows);
  for (let i = 0; i < a.length; i++) {
    id.data[i * 4] = 0; id.data[i * 4 + 1] = 255; id.data[i * 4 + 2] = 110;
    id.data[i * 4 + 3] = Math.round(Math.pow(a[i], 1.3) * 80);
  }
  gc.putImageData(id, 0, 0);
}

/* ---------- setup ---------- */
function setup() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = MINI ? Math.min(W, H) * 0.74 : Math.min(W * 0.62, H * 0.54);
  cx = W / 2; cy = MINI ? H * 0.44 : H * 0.40;
  fs = Math.max(6, Math.min(11, Math.round(S / 58)));
  cols = Math.ceil(W / fs); rows = Math.ceil(H / fs);
  buildLum();
  chars = new Array(cols * rows);
  bright = new Float32Array(cols * rows);
  for (let c = 0; c < cols; c++) {
    let s = rnd(SNIPPETS), i = (Math.random() * s.length) | 0;
    for (let r = 0; r < rows; r++) {
      if (i >= s.length) { s = rnd(SNIPPETS); i = 0; }
      chars[r * cols + c] = s[i++];
    }
  }
  drops = Array.from({ length: cols * 3 }, (_, j) => newDrop(j % cols, true));
  // righe da monitor
  scan = document.createElement("canvas"); scan.width = 4; scan.height = 3;
  const sc = scan.getContext("2d"); sc.fillStyle = "rgba(0,0,0,0.28)"; sc.fillRect(0, 2, 4, 1);
  scan = ctx.createPattern(scan, "repeat");
}
function newDrop(c, initial) {
  return { c, y: initial ? Math.random() * rows * 1.5 - rows * 0.5 : -Math.random() * rows * 0.4,
           v: 0.35 + Math.random() * 0.75, len: 6 + Math.random() * 22,
           s: rnd(SNIPPETS), i: 0, last: -1 };
}

/* ---------- animazione ---------- */
let last = 0, acc = 0, typed = 0, glitch = 0, ponzImg = null;
function renderPonz(ph, sz) {
  const pad = Math.ceil(sz * 1.2);
  const mk = () => { const c = document.createElement("canvas");
    c.width = Math.ceil((ph * PONZ_W + pad * 2) * DPR); c.height = Math.ceil((ph + pad * 2) * DPR); return c; };
  const c = mk(), ink = mk(), rc = mk();
  for (const [cn, glow] of [[c, true], [ink, false]]) {
    const o = cn.getContext("2d");
    o.setTransform(DPR * ph, 0, 0, DPR * ph, pad * DPR, pad * DPR);
    if (glow) { o.shadowColor = "rgba(0,255,102,0.4)"; o.shadowBlur = sz * 0.4 * DPR; }
    o.fillStyle = "#12923f";
    o.fill(PONZ_PATH, "evenodd");
  }
  return { c, ink, rc, pad, h: Math.round(ph) };
}
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(60, t - last || 16); last = t; acc += dt;
  if (acc < 33) return;           // ~30 fps
  const step = reduce ? 0 : acc / 16; acc = 0;

  // gocce: scrivono il codice dall'alto verso il basso
  for (let j = 0; j < drops.length; j++) {
    const d = drops[j];
    d.y += d.v * step;
    const r = Math.floor(d.y);
    if (r !== d.last && r >= 0 && r < rows) {
      if (d.i >= d.s.length) { d.s = rnd(SNIPPETS); d.i = 0; }
      const k = r * cols + d.c;
      chars[k] = d.s[d.i++];
      bright[k] = 1;
      d.last = r;
    }
    if (d.y - d.len > rows) drops[j] = newDrop(d.c, false);
  }
  // decadimento scie + sfarfallio di qualche carattere
  for (let k = 0; k < bright.length; k++) if (bright[k] > 0) bright[k] = Math.max(0, bright[k] - 0.028 * step);
  for (let n = 0; n < cols * 0.6 * step; n++) {
    chars[(Math.random() * chars.length) | 0] = POOL[(Math.random() * POOL.length) | 0];
  }

  ctx.globalAlpha = 1;
  ctx.fillStyle = "#010503"; ctx.fillRect(0, 0, W, H);

  // bagliore volumetrico
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = "lighter";
  ctx.filter = "none";
  ctx.drawImage(glowCanvas, 0, 0, cols * fs, rows * fs);
  ctx.globalCompositeOperation = "source-over";

  // caratteri
  ctx.font = `${fs}px ${FONT}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#19ff7a";
  const heads = [], trails = [];
  if (glitch > 0) glitch--; else if (!reduce && Math.random() < 0.012) glitch = 3;
  const gRow = (Math.random() * rows) | 0, gShift = glitch ? ((Math.random() * 6 - 3) | 0) * fs : 0;
  for (let r = 0; r < rows; r++) {
    const y = r * fs + fs / 2;
    const off = glitch && Math.abs(r - gRow) < 4 ? gShift : 0;
    for (let c = 0; c < cols; c++) {
      const k = r * cols + c, L = lum[k];
      if (L < 0.04) continue;
      const b = bright[k];
      if (b > 0.97 && L > 0.2) { heads.push(k); continue; }
      if (b > 0.45 && L > 0.15) { trails.push(k); continue; }
      const a = L * 0.62;
      if (a < 0.03) continue;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.fillText(chars[k], c * fs + fs / 2 + off, y);
    }
  }
  // scie luminose
  ctx.fillStyle = "#6dffa8";
  for (const k of trails) {
    ctx.globalAlpha = Math.min(1, lum[k] * (0.5 + bright[k]));
    ctx.fillText(chars[k], (k % cols) * fs + fs / 2, ((k / cols) | 0) * fs + fs / 2);
  }
  // teste delle gocce: quasi bianche
  ctx.fillStyle = "#eafff1";
  for (const k of heads) {
    ctx.globalAlpha = Math.min(1, lum[k] * 1.2);
    ctx.fillText(chars[k], (k % cols) * fs + fs / 2, ((k / cols) | 0) * fs + fs / 2);
  }
  ctx.globalAlpha = 1;

  // righe da monitor
  ctx.fillStyle = scan; ctx.fillRect(0, 0, W, H);

  if (!MINI) drawSignature(t);
}

/* ---------- firma animata: </ >  →  </    >  →  Ponz scritto a bomboletta ---------- */
let T0 = null, mist = [];
const LT = [{ d: 950 }, { d: 650 }, { d: 750 }, { d: 850 }];   // durata di P, o, n, z (ms)
const SPRAY_START = 1700, LGAP = 140;
(() => { let s = SPRAY_START; for (const l of LT) { l.s = s; s += l.d + LGAP; } })();
const SPRAY_END = LT[3].s + LT[3].d;
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

// "goccia" di vernice spray (pre-disegnata una volta)
const SPRITE = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 96;
  const o = c.getContext("2d"), g = o.createRadialGradient(48, 48, 0, 48, 48, 48);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.55, "rgba(255,255,255,0.9)");
  g.addColorStop(0.8, "rgba(255,255,255,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
  o.fillStyle = g; o.fillRect(0, 0, 96, 96);
  o.fillStyle = "#fff";
  for (let i = 0; i < 140; i++) {                       // puntini sparsi sul bordo
    const a = Math.random() * 6.283, r = 30 + Math.random() * 18;
    o.globalAlpha = Math.random();
    o.beginPath(); o.arc(48 + Math.cos(a) * r, 48 + Math.sin(a) * r, Math.random() * 1.6 + 0.3, 0, 6.283); o.fill();
  }
  return c;
})();

function drawSignature(t) {
  if (T0 === null) T0 = t;
  const el = reduce ? 1e9 : t - T0;
  const sz = Math.max(18, S * 0.07);
  const ph = sz * 1.55, pw = ph * PONZ_W;
  ctx.font = `700 ${sz}px ${FONT}`;
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const lw = ctx.measureText("</").width, rw = ctx.measureText(">").width, gap = sz * 0.45;
  const total = lw + gap + pw + gap + rw;
  const midY = Math.min(H - ph * 0.7, cy + S * 1.0);
  const xL = cx - total / 2, xP = xL + lw + gap, xR = xP + pw + gap;
  const closed = lw + sz * 0.3 + rw, xLc = cx - closed / 2, xRc = xLc + lw + sz * 0.3;

  // 1) compare </ >   2) si apre
  const a = ease((el - 700) / 800);
  ctx.globalAlpha = clamp01(el / 350);
  ctx.shadowColor = "rgba(0,255,102,0.35)"; ctx.shadowBlur = sz * 0.35;
  ctx.fillStyle = "#0f7a3a";
  ctx.fillText("</", xLc + (xL - xLc) * a, midY);
  ctx.fillText(">", xRc + (xR - xRc) * a, midY);
  ctx.globalAlpha = 1;

  // 3) Ponz scritto a bomboletta, una lettera alla volta
  if (!ponzImg || ponzImg.h !== Math.round(ph)) ponzImg = renderPonz(ph, sz);
  const pad = ponzImg.pad, ox = xP - pad, oy = midY - ph / 2 - pad;
  if (el >= SPRAY_END + 450) {
    ctx.shadowBlur = 0;
    ctx.drawImage(ponzImg.c, ox, oy, ponzImg.c.width / DPR, ponzImg.c.height / DPR);
  } else if (el > SPRAY_START) {
    const rc = ponzImg.rc, ro = rc.getContext("2d");
    ro.setTransform(1, 0, 0, 1, 0, 0);
    ro.globalCompositeOperation = "source-over";
    ro.clearRect(0, 0, rc.width, rc.height);
    ro.setTransform(DPR * ph, 0, 0, DPR * ph, pad * DPR, pad * DPR);
    let nozzle = null;
    LETTERS.forEach((dots, li) => {
      const p = clamp01((el - LT[li].s) / LT[li].d);
      const k = Math.floor(p * dots.length);
      for (let j = 0; j < k; j++) {
        const [x, y, r] = dots[j], rr = r * 1.1;
        ro.save(); ro.translate(x, y); ro.rotate(j * 2.39 + li);
        ro.drawImage(SPRITE, -rr, -rr, rr * 2, rr * 2);
        ro.restore();
      }
      if (p > 0 && p < 1 && k > 0) nozzle = dots[k - 1];
    });
    ro.setTransform(1, 0, 0, 1, 0, 0);
    ro.globalCompositeOperation = "source-in";
    ro.drawImage(ponzImg.ink, 0, 0);
    ctx.shadowColor = "rgba(0,255,102,0.4)"; ctx.shadowBlur = sz * 0.4;
    ctx.drawImage(rc, ox, oy, rc.width / DPR, rc.height / DPR);
    ctx.shadowBlur = 0;
    // nebbiolina di vernice attorno all'ugello
    if (nozzle) {
      const nx = xP + nozzle[0] * ph, ny = midY - ph / 2 + nozzle[1] * ph, nr = nozzle[2] * ph;
      for (let i = 0; i < 7; i++) {
        const an = Math.random() * 6.283, d = nr * (0.8 + Math.random() * 1.3);
        mist.push({ x: nx + Math.cos(an) * d, y: ny + Math.sin(an) * d, r: Math.random() * 1.3 + 0.4, life: 1 });
      }
    }
    // dissolvenza finale verso la scritta completa
    const f = clamp01((el - SPRAY_END) / 450);
    if (f > 0) {
      ctx.globalAlpha = f;
      ctx.drawImage(ponzImg.c, ox, oy, ponzImg.c.width / DPR, ponzImg.c.height / DPR);
      ctx.globalAlpha = 1;
    }
  }
  if (mist.length) {
    ctx.fillStyle = "#12923f";
    for (const m of mist) {
      ctx.globalAlpha = m.life * 0.55;
      ctx.fillRect(m.x, m.y, m.r, m.r);
      m.life -= 0.035;
    }
    ctx.globalAlpha = 1;
    mist = mist.filter(m => m.life > 0);
  }
  ctx.shadowBlur = 0;
}

addEventListener("resize", setup);
setup();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
